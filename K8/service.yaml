apiVersion: v1
kind: Service
metadata:
  name: spring-service-name        # must match the name in ingress.yaml
spec:
  type: ClusterIP                  # internal only; Ingress is the public entrance
  selector:
    app: spring-label-value        # must match the Pod label in deployment.yml
  ports:
    - port: 8080     # port of the Service (what ingress.yaml uses)
      targetPort: 8080             # port your Spring app listens on in the Pod