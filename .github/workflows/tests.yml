name: MyTestName

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  my_test_id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build
        run: ./gradlew assemble --no-daemon
      - name: Test
        run: ./gradlew test --no-daemon

  img-build-push:
    needs: my_test_id          # runs only if my_test_id succeeded
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/demo_app_img_name_on_hub:${{ github.sha }}

  update-config:
    needs: img-build-push            # only after the image is pushed
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          repository: shivakumarcd/K8s_for_demo
          token: ${{ secrets.K8_CONFIG_REPO_TOKEN }}

      - name: Update image tag
        run: |
          sed -i "s|image: .*demo_app_img_name_on_hub:.*|image: shivakumardwd/demo_app_img_name_on_hub:${{ github.sha }}|" app/deployment.yml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (git commit -am "Update image to ${{ github.sha }}" && git push)
