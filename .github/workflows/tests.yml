name: MyTestName

on:
  workflow_dispatch:
  push:
    branches:
      - feature_initial_setup

permissions:
  contents: read

jobs:
  my_test_id:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Running tests 123445
        run: ./gradlew test --no-daemon
